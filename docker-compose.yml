version: '3.8'

# ============================================================================
# PulsarCD - Local Development / Single Host Deployment
#
# NO CONFIG FILE NEEDED - All configuration is via environment variables!
# For Swarm deployments, use devops/docker-compose.swarm.yml instead.
# ============================================================================

services:
  # OpenSearch for log storage and search
  opensearch:
    image: opensearchproject/opensearch:3.4.0
    container_name: pulsarcd-opensearch
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - "DISABLE_SECURITY_PLUGIN=true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    # Security: the security plugin is disabled above, so this OpenSearch has
    # NO authentication — anyone who can reach it can read, alter or delete all
    # logs. Bind the published ports to the loopback interface only, never to
    # 0.0.0.0. The pulsarcd service still reaches it over the compose network.
    ports:
      - "127.0.0.1:9200:9200"
      - "127.0.0.1:9600:9600"
    networks:
      - pulsarcd-net
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20


  # PulsarCD Backend & Frontend
  pulsarcd:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pulsarcd-app
    # Security: runs as root only to reach /var/run/docker.sock (root:docker).
    # Docker API access is equivalent to root on the host, so prefer, in order:
    #   1. `group_add: ["<host docker GID>"]` with the image's non-root appuser;
    #   2. a docker-socket-proxy exposing only the endpoints this app needs.
    user: root
    # Same hardening profile as the Swarm stack: no capability is needed to open
    # a unix socket owned by uid 0 or to run git/ssh, and no-new-privileges
    # blocks setuid escalation from anything dropped into the container.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # The application port is published on all interfaces on purpose (this file
    # also serves single-host deployments) -- it is authenticated. Use
    # "127.0.0.1:5000:8000" for a pure development box.
    ports:
      - "5000:8000"
    volumes:
      # Mount Docker socket for Docker API access
      - /var/run/docker.sock:/var/run/docker.sock
      # Data volume for config file and users
      - pulsarcd-data:/data
      # Optional: Mount SSH keys for remote host access (SSH mode)
      # - ~/.ssh:/root/.ssh:ro
    environment:
      # ========== All configuration via environment variables ==========
      - PULSARCD_DEBUG=false

      # ---------- Authentication ----------
      # Everyone signs in with Google, and only the addresses listed here get
      # in. Create an OAuth 2.0 Web client at console.cloud.google.com, add this
      # deployment's origin (e.g. http://localhost:5000) to its authorised
      # JavaScript origins, and paste the client id below -- it is a public
      # identifier, not a secret. No redirect URI is needed.
      - PULSARCD_AUTH__GOOGLE_CLIENT_ID=${PULSARCD_AUTH__GOOGLE_CLIENT_ID:-}
      # Comma-separated. Reapplied on every boot, so they override whatever
      # Settings > Users holds; everything added from the UI lives alongside
      # them in /data/allowed_emails.json.
      - PULSARCD_AUTH__GOOGLE_ADMINS=${PULSARCD_AUTH__GOOGLE_ADMINS:-}
      - PULSARCD_AUTH__GOOGLE_VIEWERS=${PULSARCD_AUTH__GOOGLE_VIEWERS:-}
      # Optional break-glass administrator for when Google is unreachable.
      # Empty password = no local account and password sign-in answers 403.
      # When set it must be 12+ characters and not a placeholder, or it is
      # refused and the account is not created (see the container logs).
      - PULSARCD_AUTH__USERNAME=${PULSARCD_AUTH__USERNAME:-admin}
      - PULSARCD_AUTH__PASSWORD=${PULSARCD_AUTH__PASSWORD:-}

      # SSH host key verification is strict: an unknown host aborts the
      # connection instead of trusting whatever key answers. Keep known_hosts on
      # the read/write data volume and bootstrap it from inside the container:
      #   docker exec pulsarcd-app sh -c 'ssh-keyscan -p 22 <host> >> /data/known_hosts'
      # PULSARCD_SSH_ACCEPT_NEW_HOSTKEYS=true trusts the first key seen instead
      # (trust-on-first-use); unsafe on an untrusted network.
      - PULSARCD_SSH_KNOWN_HOSTS=/data/known_hosts
      #- PULSARCD_SSH_ACCEPT_NEW_HOSTKEYS=true

      # Set when this container sits behind a reverse proxy that rewrites
      # X-Forwarded-For; without it the per-address login rate limit only ever
      # sees the proxy address. Leave unset when the port is reached directly:
      # the header is client-controlled and would let anyone pick their bucket.
      #- PULSARCD_TRUST_PROXY_HEADERS=true

      # OpenSearch configuration
      - PULSARCD_OPENSEARCH__HOSTS=["http://opensearch:9200"]
      - PULSARCD_OPENSEARCH__INDEX_PREFIX=pulsarcd

      # AI/vLLM configuration
      - PULSARCD_AI__MODEL=txn545/Qwen3.5-122B-A10B-NVFP4
      - PULSARCD_VLLM_URL=https://llm-dev.methodinfo.fr

      # Collector settings
      - PULSARCD_COLLECTOR__LOG_INTERVAL_SECONDS=30
      - PULSARCD_COLLECTOR__METRICS_INTERVAL_SECONDS=15
      - PULSARCD_COLLECTOR__LOG_LINES_PER_FETCH=500
      - PULSARCD_COLLECTOR__RETENTION_DAYS=7

      # Host configuration (JSON array)
      # Local Docker mode - monitors containers on this host via Docker socket
      - |
        PULSARCD_HOSTS=[
          {
            "name": "local-docker",
            "mode": "docker",
            "docker_url": "unix:///var/run/docker.sock"
          }
        ]

      # ========== Alternative configurations (uncomment as needed) ==========
      #
      # SSH mode - connect to remote hosts via SSH:
      # - |
      #   PULSARCD_HOSTS=[
      #     {"name": "local-docker", "mode": "docker"},
      #     {"name": "server-1", "mode": "ssh", "hostname": "192.168.1.10", "username": "deploy"},
      #     {"name": "server-2", "mode": "ssh", "hostname": "192.168.1.11", "username": "deploy"}
      #   ]
      #
      # Swarm mode with auto-discovery (discovers all Swarm nodes automatically):
      # - |
      #   PULSARCD_HOSTS=[
      #     {
      #       "name": "swarm-manager",
      #       "mode": "docker",
      #       "docker_url": "unix:///var/run/docker.sock",
      #       "swarm_manager": true,
      #       "swarm_routing": true,
      #       "swarm_autodiscover": true
      #     }
      #   ]

    extra_hosts:
      # Allows container to reach the host machine via "host.docker.internal"
      - "host.docker.internal:host-gateway"
    depends_on:
      opensearch:
        condition: service_healthy
    networks:
      - pulsarcd-net
    restart: unless-stopped

networks:
  pulsarcd-net:
    driver: bridge

volumes:
  opensearch-data:
    driver: local
  pulsarcd-data:
    driver: local
