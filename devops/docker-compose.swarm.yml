# ============================================================================
# PulsarCD - Docker Swarm Deployment (Agent-Based Architecture)
# Deploy with: docker stack deploy -c docker-compose.swarm.yml pulsarcd
#
# IMPORTANT: Copy .env.example to .env and configure before deploying
#
# Architecture:
# - Backend: API server (read-only from OpenSearch, action queue)
# - Agent: Deployed on EVERY node (global mode), collects logs/metrics locally
# - OpenSearch: Storage for logs and metrics
#
# Security: Backend has NO access to Docker sockets. Agents run locally on
# each node and push data directly to OpenSearch.
# ============================================================================

services:
  # ==========================================================================
  # OpenSearch - Log and metrics storage
  # ==========================================================================
  opensearch:
    image: opensearchproject/opensearch:3.4.0
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - "DISABLE_SECURITY_PLUGIN=true"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == ${OPENSEARCH_NODE_HOSTNAME:-server-d}
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  # ==========================================================================
  # PulsarCD Backend - API Server
  # Docker socket mounted read-only for Swarm API queries (list containers/services)
  # Actual container operations (start/stop/exec) go through agents
  # ==========================================================================
  swarm-manager:
    image: ${DOCKER_REGISTRY_URL}/pulsarcd:latest
    build:
      context: ..
      dockerfile: Dockerfile
      target: production
    # Security: runs as root ONLY because /var/run/docker.sock is owned by
    # root:docker and the image has no matching docker group. Membership in the
    # Docker API is equivalent to root on the node, so this container is a
    # high-value target: any RCE here also reaches the mounted SSH keys.
    # Alternatives, in increasing order of safety:
    #   1. drop `user: root` and add `group_add: ["<host docker GID>"]` so the
    #      image's non-root appuser can reach the socket;
    #   2. put a docker-socket-proxy in front of the socket and expose only the
    #      read-only endpoints this service needs (containers/services/nodes),
    #      then mount no socket at all here.
    user: root
    # Hardening compatible with the socket + SSH mounts: no capability is
    # needed to open a unix socket owned by uid 0 or to run an SSH client, and
    # no-new-privileges blocks setuid escalation from any injected binary.
    # (Same profile as the agent service below; read_only rootfs is NOT applied
    # because git/docker CLI operations write outside /tmp.)
    # NOTE: older Docker engines silently ignore security_opt in `stack deploy`;
    # verify with `docker inspect` on the running task.
    cap_drop:
      - ALL
    cap_add:
      # Required: the SSH keys are bind-mounted from an operator account's
      # ~/.ssh (mode 700, owned by that uid), and this container runs as root.
      # Root only reads files it does not own by bypassing the permission
      # check, which "cap_drop: ALL" takes away -- every SSH operation (build,
      # deploy, the .env editor, the periodic `docker service ls`) then fails
      # with EACCES on the key. DAC_READ_SEARCH grants the read/search bypass
      # only; DAC_OVERRIDE would also bypass write and execute checks.
      - DAC_READ_SEARCH
    security_opt:
      - no-new-privileges:true
    # The default soft limit of 1024 fds is reached quickly: this process holds
    # long-lived SSH connections to every host plus OpenSearch/Docker sockets,
    # and once exhausted every request fails with EMFILE.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    extra_hosts:
      # Map 'dockerhost' to the Docker host IP for SSH access
      - "dockerhost:host-gateway"
    volumes:
      # Mount SSH keys for SSH to host
      - ${SSH_KEYS_PATH:-/home/user/.ssh}:/root/.ssh:ro
      # Docker socket for Swarm API queries (read-only)
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Data volume for config file and users
      - pulsarcd-data:/data
    environment:
      - PULSARCD_DEBUG=false
      - AGENT_LOG_LEVEL=${AGENT_LOG_LEVEL:-INFO}

      # OpenSearch configuration (use stack-prefixed name)
      - PULSARCD_OPENSEARCH__HOSTS=["http://opensearch:9200"]
      - PULSARCD_OPENSEARCH__INDEX_PREFIX=pulsarcd

      # AI/vLLM configuration
      - PULSARCD_AI__MODEL=${VLLM_MODEL:-Qwen/Qwen3.5-122B-A10B}
      - PULSARCD_VLLM_URL=${VLLM_URL:-http://vllm-dev-service:8000}

      # Collector settings - agents handle log/metrics collection
      - PULSARCD_COLLECTOR__AGENTS_ONLY=true
      - PULSARCD_COLLECTOR__RETENTION_DAYS=${LOG_RETENTION_DAYS:-7}

      # GitHub integration for Stacks tab
      - PULSARCD_GITHUB__TOKEN=${PULSARCD_GITHUB__TOKEN}
      - PULSARCD_GITHUB__USERNAME=${PULSARCD_GITHUB__USERNAME}
      - PULSARCD_GITHUB__USEREMAIL=${PULSARCD_GITHUB__USEREMAIL}
      - PULSARCD_GITHUB__REPOS_PATH=${PULSARCD_GITHUB__REPOS_PATH:-/home/user/repos}
      - PULSARCD_GITHUB__SSH_HOST=${PULSARCD_GITHUB__SSH_HOST:-dockerhost}
      - PULSARCD_GITHUB__SSH_USER=${PULSARCD_GITHUB__SSH_USER:-user}
      # Which repos to show in Stacks: "all" (default) or "starred"
      - PULSARCD_GITHUB__REPOS_MODE=${PULSARCD_GITHUB__REPOS_MODE:-all}
      # Docker registry for build/push operations
      - PULSARCD_GITHUB__REGISTRY_URL=${DOCKER_REGISTRY_URL}
      - PULSARCD_GITHUB__REGISTRY_USERNAME=${DOCKER_REGISTRY_USERNAME}
      - PULSARCD_GITHUB__REGISTRY_PASSWORD=${DOCKER_REGISTRY_PASSWORD}

      # Authentication
      # This stack is published on the public internet through Traefik, so no
      # credential may fall back to a default: every secret below uses the
      # strict ":?" form and the deploy fails when it is unset.
      #
      # Google Sign-In is how everyone gets in. The client id is REQUIRED (it is
      # public, not a secret) and so is at least one admin address: without them
      # the deployment has no way to admit anybody except the optional
      # break-glass account below.
      - PULSARCD_AUTH__GOOGLE_CLIENT_ID=${PULSARCD_AUTH__GOOGLE_CLIENT_ID:?PULSARCD_AUTH__GOOGLE_CLIENT_ID must be set to the OAuth Web client id}
      - PULSARCD_AUTH__GOOGLE_ADMINS=${PULSARCD_AUTH__GOOGLE_ADMINS:?PULSARCD_AUTH__GOOGLE_ADMINS must list at least one authorised address}
      - PULSARCD_AUTH__GOOGLE_VIEWERS=${PULSARCD_AUTH__GOOGLE_VIEWERS:-}
      # Break-glass local administrator, OPTIONAL: a way back in when Google is
      # unreachable. An empty password means no local account at all and
      # password sign-in answers 403 -- which is a fine way to deploy. When set,
      # it must be strong (>= 12 characters, no placeholder) or it is refused
      # and the account is not created.
      - PULSARCD_AUTH__USERNAME=${PULSARCD_AUTH__USERNAME:-admin}
      - PULSARCD_AUTH__PASSWORD=${PULSARCD_AUTH__PASSWORD:-}
      # REQUIRED by choice: the backend auto-generates a random JWT secret when
      # this is empty, which is not weak but is regenerated on every restart
      # (all sessions are invalidated) and differs per replica (tokens issued by
      # one task are rejected by the others). Pinning it here keeps sessions
      # valid across restarts and scale-out. Generate with: openssl rand -base64 32
      - PULSARCD_AUTH__JWT_SECRET=${PULSARCD_AUTH__JWT_SECRET:?PULSARCD_AUTH__JWT_SECRET must be set to a strong random value}
      - PULSARCD_AUTH__JWT_EXPIRY_HOURS=${PULSARCD_AUTH__JWT_EXPIRY_HOURS:-24}
      # REQUIRED: must match AGENT_AUTH_KEY below, agents must not run unauthenticated.
      - PULSARCD_AUTH__AGENT_KEY=${PULSARCD_AUTH__AGENT_KEY:?PULSARCD_AUTH__AGENT_KEY must be set to a non-empty value}

      - PULSARCD_MCP__API_KEY=${PULSARCD_MCP__API_KEY:-}

      # Per-agent authentication keys, as a JSON object keyed by the agent id
      # (the agent service sets AGENT_AGENT_ID={{.Node.Hostname}}, so the keys
      # are indexed by node hostname). Optional: when it is empty the single
      # shared PULSARCD_AUTH__AGENT_KEY above is accepted, which is the current
      # behaviour. Enabling it requires giving each node its own key -- see the
      # "Per-agent keys" note in README.md before setting it, a mismatch makes
      # every agent stop reporting.
      - PULSARCD_AUTH__AGENT_KEYS=${PULSARCD_AUTH__AGENT_KEYS:-}

      # Trust X-Forwarded-For: this stack is published behind Traefik, so the
      # per-address login rate limit only sees the proxy address without it.
      # Traefik must be configured to overwrite the header
      # (forwardedHeaders.trustedIPs), otherwise a client picks its own bucket.
      - PULSARCD_TRUST_PROXY_HEADERS=${PULSARCD_TRUST_PROXY_HEADERS:-true}

      # SSH host key verification for MONITORED hosts is strict: an unknown host
      # aborts the connection. ~/.ssh is mounted read-only, so the known_hosts
      # file lives on the read/write data volume instead. Bootstrap it once per
      # host with:
      #   docker exec <task> sh -c 'ssh-keyscan -p 22 <host> >> /data/known_hosts'
      # Set PULSARCD_SSH_ACCEPT_NEW_HOSTKEYS=true to trust the first key seen
      # instead -- unsafe on an untrusted network.
      - PULSARCD_SSH_KNOWN_HOSTS=${PULSARCD_SSH_KNOWN_HOSTS:-/data/known_hosts}
      - PULSARCD_SSH_ACCEPT_NEW_HOSTKEYS=${PULSARCD_SSH_ACCEPT_NEW_HOSTKEYS:-false}

      # The BUILD/DEPLOY host (build, deploy, the .env editor) is separate: it is
      # this node's own Docker host, reached through the `dockerhost` host-gateway
      # alias. That name resolves only inside the container, so no known_hosts
      # prepared outside it can ever contain the entry -- a strict default just
      # fails closed with no key an operator could have installed in advance.
      # "accept-new" pins the key on the first connection (into the file above)
      # and verifies strictly from then on. Point this at a known_hosts file to
      # verify strictly from the very first connection instead.
      - PULSARCD_GITHUB__SSH_KNOWN_HOSTS_PATH=${PULSARCD_GITHUB__SSH_KNOWN_HOSTS_PATH:-accept-new}
      # Swarm manager config - queries Swarm API to list all containers/services
      # Collection is disabled (agents_only=true), this is only for listing
      - PULSARCD_HOSTS=[{"name":"swarm-manager","mode":"docker","docker_url":"unix:///var/run/docker.sock","swarm_manager":true,"swarm_autodiscover":true}]
    networks:
      - proxy
      - internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - opensearch
    deploy:
      replicas: 1
      labels:
        # Enable Traefik
        - "traefik.enable=true"

        # Define service port
        - "traefik.http.services.pulsarcd.loadbalancer.server.port=8000"

        # HTTPS Router (main)
        - "traefik.http.routers.pulsarcd.rule=Host(`${TRAEFIK_HOST}`)"
        - "traefik.http.routers.pulsarcd.entrypoints=websecure"
        - "traefik.http.routers.pulsarcd.tls.certresolver=letsencrypt"
        - "traefik.http.routers.pulsarcd.middlewares=global@file"
        - "traefik.http.routers.pulsarcd.service=pulsarcd"
        - "traefik.http.routers.pulsarcd.priority=1"

        # HTTPS Router (WebSocket terminal) - bypasses WAF which blocks WS upgrades
        - "traefik.http.routers.pulsarcd-ws.rule=Host(`${TRAEFIK_HOST}`) && PathPrefix(`/api/terminal/ws`)"
        - "traefik.http.routers.pulsarcd-ws.entrypoints=websecure"
        - "traefik.http.routers.pulsarcd-ws.tls.certresolver=letsencrypt"
        - "traefik.http.routers.pulsarcd-ws.middlewares=security-headers@file"
        - "traefik.http.routers.pulsarcd-ws.service=pulsarcd"
        - "traefik.http.routers.pulsarcd-ws.priority=100"

        # HTTPS Router (SSE log streams) - bypasses WAF which buffers streaming responses
        - "traefik.http.routers.pulsarcd-sse.rule=Host(`${TRAEFIK_HOST}`) && PathRegexp(`^/api/stacks/actions/.+/logs/stream`)"
        - "traefik.http.routers.pulsarcd-sse.entrypoints=websecure"
        - "traefik.http.routers.pulsarcd-sse.tls.certresolver=letsencrypt"
        - "traefik.http.routers.pulsarcd-sse.middlewares=security-headers@file"
        - "traefik.http.routers.pulsarcd-sse.service=pulsarcd"
        - "traefik.http.routers.pulsarcd-sse.priority=50"

        # HTTP Router (redirect to HTTPS)
        - "traefik.http.routers.pulsarcd-http.rule=Host(`${TRAEFIK_HOST}`)"
        - "traefik.http.routers.pulsarcd-http.entrypoints=web"
        - "traefik.http.routers.pulsarcd-http.middlewares=redirect-to-https@file"
        - "traefik.http.routers.pulsarcd-http.service=noop@internal"
      # Swarm stops an unhealthy task with SIGTERM, which uvicorn handles
      # cleanly and exits 0. With "on-failure" that counts as a success, so
      # the task is never replaced and the service stays at 0/1 forever.
      # "any" makes Swarm reschedule it.
      restart_policy:
        condition: any
        delay: 5s
      placement:
        constraints:
          - node.hostname == ${BACKEND_NODE_HOSTNAME:-server-b}

  # ==========================================================================
  # Test - Build target for running tests (not deployed)
  # Usage: docker compose -f docker-compose.swarm.yml run --rm test
  # ==========================================================================
  test:
    image: ${DOCKER_REGISTRY_URL}/pulsarcd-test:latest
    build:
      context: ..
      dockerfile: Dockerfile
      target: test
    deploy:
      replicas: 0

  # ==========================================================================
  # PulsarCD Agent - Deployed on EVERY node (global mode)
  # Collects Docker logs/metrics locally and pushes to OpenSearch
  # ==========================================================================
  agent:
    image: ${DOCKER_REGISTRY_URL}/pulsarcd-agent:latest
    x-platforms: linux/amd64,linux/arm64
    build:
      context: ..
      dockerfile: Dockerfile.agent
    # Security hardening:
    # - No privileged mode, no host PID namespace
    # - All Linux capabilities dropped (agent only does HTTP + Docker API calls)
    # - no-new-privileges blocks setuid escalation
    # - Read-only rootfs with a tmpfs for transient writes
    # NOTE: /var/run/docker.sock still grants Docker API access (equivalent to host root).
    # The next hardening step is to mediate it via a docker-socket-proxy with a whitelist
    # of endpoints — see security follow-ups.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      # Mount Docker socket for LOCAL container access only.
      # NB: the :ro flag only protects the socket *file*, not the Docker API behind it.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # System metrics (read-only)
      - /sys:/sys:ro
    environment:
      # Agent ID: use node hostname (set by Swarm)
      - AGENT_AGENT_ID={{.Node.Hostname}}

      # Backend URL for polling actions (use stack-prefixed name)
      - AGENT_BACKEND_URL=http://swarm-manager:8000

      # OpenSearch configuration (use stack-prefixed name)
      - AGENT_OPENSEARCH__HOSTS=["http://opensearch:9200"]
      - AGENT_OPENSEARCH__INDEX_PREFIX=pulsarcd

      # Docker socket path (inside container)
      - AGENT_DOCKER_URL=unix:///var/run/docker.sock

      # Collection intervals
      - AGENT_LOG_INTERVAL=30
      - AGENT_METRICS_INTERVAL=15
      - AGENT_ACTION_POLL_INTERVAL=2

      # Initial log lines to fetch
      - AGENT_LOG_LINES_PER_FETCH=500

      # Authentication key for swarm-manager API (must match PULSARCD_AUTH__AGENT_KEY).
      # REQUIRED: deploy fails if unset or empty — agents must not run unauthenticated.
      - AGENT_AUTH_KEY=${PULSARCD_AUTH__AGENT_KEY:?PULSARCD_AUTH__AGENT_KEY must be set to a non-empty value}

      # Log level (DEBUG, INFO, WARNING, ERROR)
      - AGENT_LOG_LEVEL=${AGENT_LOG_LEVEL:-INFO}

      # NVIDIA GPU: tells the NVIDIA Container Toolkit to inject nvidia-smi and libraries
      - NVIDIA_VISIBLE_DEVICES=all
      - AMD_VISIBLE_DEVICES=all
    networks:
      - internal
    depends_on:
      - opensearch
      - swarm-manager
    deploy:
      # Deploy on ALL nodes in the Swarm
      mode: global
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10
        window: 120s
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

# ============================================================================
# Volumes
# ============================================================================
volumes:
  opensearch-data:
    driver: local
  pulsarcd-data:
    driver: local

# ============================================================================
# Networks
# ============================================================================
networks:
  proxy:
    external: true
  internal:
    # Security: NOT attachable. OpenSearch runs with DISABLE_SECURITY_PLUGIN=true
    # (no authentication at all), so anyone able to `docker network connect` a
    # throwaway container to this overlay could read, alter or delete every log
    # and metric index. Only stack services may join it.
    #
    # MIGRATION REQUIRED on a cluster that was deployed before this line existed.
    # `docker stack deploy` never reconciles the options of an existing network
    # and Docker cannot flip `attachable` on a live overlay, so the old network
    # stays attachable and this setting has NO effect until it is recreated:
    #   docker stack rm pulsarcd
    #   # wait for the tasks to actually disappear, then:
    #   docker network rm pulsarcd_internal
    #   docker stack deploy -c devops/docker-compose.swarm.yml pulsarcd
    # Verify with:
    #   docker network inspect pulsarcd_internal -f '{{.Attachable}}'   # -> false
    driver: overlay
    attachable: false
